name: texfolia

services:
  compiler:
    build:
      context: .
      dockerfile: apps/compiler/Dockerfile.local
    platform: linux/amd64
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ENGINE_URL: http://latex-engine:8080
      ENGINE_IMAGE: texfolia-latex-engine:local
      COMPILER_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-texfolia}_default
    depends_on:
      latex-engine:
        condition: service_healthy
    volumes:
      - ./apps/compiler/src:/app/apps/compiler/src:ro
      - ./packages/project-paths/src:/app/packages/project-paths/src:ro
      - compiler-data:/app/apps/compiler/.cache
      - /var/run/docker.sock:/var/run/docker.sock
    user: root
    command: ["bun", "--watch", "src/index.ts"]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "--eval",
          "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 1s
      timeout: 3s
      retries: 60

  latex-engine:
    image: texfolia-latex-engine:local
    build:
      context: .
      dockerfile: apps/compiler/Dockerfile
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    pids_limit: 64
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:18-alpine
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  compiler-data:
  pgdata:
