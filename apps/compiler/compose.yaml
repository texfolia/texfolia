services:
  compiler:
    build: .
    platform: linux/amd64
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./src:/app/src:ro
    command: ["bun", "--watch", "src/index.ts"]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
