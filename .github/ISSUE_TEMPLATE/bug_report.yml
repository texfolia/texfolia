name: Bug report
description: Something in Texfolia doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor
        - Compiling and PDF preview
        - Collaboration and sharing
        - Git integration
        - AI assistant
        - Accounts and billing
        - Marketing site or docs
        - Local development
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: Firefox 150 on macOS 26
  - type: textarea
    id: logs
    attributes:
      label: Logs or LaTeX source
      description: Compiler output, console errors, or a minimal document.
      render: text
