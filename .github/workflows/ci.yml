name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push replaces a pull request's run. Every commit on main keeps its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI_BUN_VERSION: 1.4.4

jobs:
  postgres:
    name: App database with plain Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: texfolia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d texfolia_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://user:password@127.0.0.1:5432/texfolia_test
      INTEGRATION_DATABASE_URL: postgres://user:password@127.0.0.1:5432/texfolia_test
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select affected checks
        id: select
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_FULL_RUN: ${{ github.event_name == 'push' }}
        run: node scripts/ci-select.mjs
      - uses: ./.github/actions/setup-ci
        if: steps.select.outputs.postgres == 'true'
        with:
          playwright: ${{ steps.select.outputs.postgres-browser }}
      - name: Build app once for browser suites
        if: steps.select.outputs.postgres-build == 'true'
        run: bunx turbo run build --filter=app
      - name: Apply database schema
        if: steps.select.outputs.postgres == 'true'
        run: bun run db:push
      - name: Exercise app database operations
        if: steps.select.outputs.database == 'true'
        run: bun run apps/app/test/postgres.ts
      - name: Exercise project settings and account usage
        if: steps.select.outputs.settings == 'true'
        run: bun run --cwd apps/app test:settings
      - name: Exercise billing pages with Postgres
        if: steps.select.outputs.pricing == 'true'
        run: bun run --cwd apps/app test:pricing:prebuilt
      - name: Exercise authenticated compile retries with Postgres
        if: steps.select.outputs.compile-route == 'true'
        run: bun run --cwd apps/app test:compile-route
      - name: Exercise AI billing with Postgres
        if: steps.select.outputs.ai-billing == 'true'
        run: bun run --cwd apps/app test:ai-billing
      - name: Exercise the managed assistant
        if: steps.select.outputs.assistant == 'true'
        run: bun run --cwd apps/app test:ai-assistant
      - name: Exercise real-time collaboration locally
        if: steps.select.outputs.collaboration == 'true'
        run: |
          bun run --cwd apps/app test:collaboration
          bun run --cwd apps/app test:collaboration-cache
      - name: Exercise metadata synchronization in two authenticated workspaces
        if: steps.select.outputs.workspace-metadata == 'true'
        run: bun run --cwd apps/app test:workspace-metadata:prebuilt
      - name: Exercise project controls, sharing, and keyboard access
        if: steps.select.outputs.ui-overhaul == 'true'
        run: bun run --cwd apps/app test/ui-overhaul.ts
      - name: Exercise GitHub and GitLab integration with Postgres and local R2
        if: steps.select.outputs.git == 'true'
        run: bun run --cwd apps/app test:git
      - name: Exercise project source storage with local R2
        if: steps.select.outputs.source-storage == 'true'
        run: bun run apps/app/test/source-storage.ts
      - name: Test project tags and imports
        if: steps.select.outputs.projects == 'true'
        run: bun run --cwd apps/app test:projects
      - name: Exercise templates with Postgres and local R2
        if: steps.select.outputs.templates == 'true'
        run: bun run apps/app/test/templates.ts
      - name: Exercise template seed commands with Postgres and local R2
        if: steps.select.outputs.template-seed == 'true'
        run: bun run packages/db/test/template-seed-cli.ts
      - name: Exercise template previews and retries in a browser without cron
        if: steps.select.outputs.template-lifecycle == 'true'
        run: bun run --cwd apps/app test:template-lifecycle:prebuilt
  browser:
    name: Browser suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select affected checks
        id: select
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_FULL_RUN: ${{ github.event_name == 'push' }}
        run: node scripts/ci-select.mjs
      - uses: ./.github/actions/setup-ci
        if: steps.select.outputs.browser == 'true'
        with:
          playwright: "true"
      - name: Copy browser assets
        if: steps.select.outputs.browser == 'true'
        run: |
          bun run --cwd apps/app latex:assets
          bun run --cwd apps/app spelling:assets
      - name: Exercise sign-in on the development server
        if: steps.select.outputs.login == 'true'
        run: bun run --cwd apps/app test:login
      - name: Exercise Vim and Emacs keymaps
        if: steps.select.outputs.editor-keymaps == 'true'
        run: bun run --cwd apps/app test:editor-keymaps
      - name: Exercise spell check
        if: steps.select.outputs.spelling == 'true'
        run: bun run --cwd apps/app test:spelling
      - name: Exercise SyncTeX navigation
        if: steps.select.outputs.synctex == 'true'
        run: bun run --cwd apps/app test:synctex
      - name: Exercise themes and the settings dialog
        if: steps.select.outputs.themes == 'true'
        run: bun run --cwd apps/app test:themes
      - name: Exercise editing, undo, and workspace rendering
        if: steps.select.outputs.editor-runtime == 'true'
        run: bun run --cwd apps/app test:editor-runtime
      - name: Exercise previews, quick open, and AI change review
        if: steps.select.outputs.editor-features == 'true'
        run: bun run --cwd apps/app test:editor-features
      - name: Exercise keyboard access, focus, and reduced motion
        if: steps.select.outputs.workspace-accessibility == 'true'
        run: bun run --cwd apps/app test:workspace-accessibility
  engine:
    name: LaTeX engine
    runs-on: ubuntu-latest
    env:
      ENGINE_URL: http://127.0.0.1:8081
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select affected checks
        id: select
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_FULL_RUN: ${{ github.event_name == 'push' }}
        run: node scripts/ci-select.mjs
      - uses: ./.github/actions/setup-ci
        if: steps.select.outputs.engine == 'true'
        with:
          playwright: ${{ steps.select.outputs.workspace-upload }}
      - uses: docker/setup-buildx-action@v4
        if: steps.select.outputs.engine == 'true'
      - name: Build the engine image
        if: steps.select.outputs.engine == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/compiler/Dockerfile
          platforms: linux/amd64
          tags: texfolia-latex-engine:local
          load: true
          provenance: false
          cache-from: type=gha,scope=latex-engine
          cache-to: type=gha,scope=latex-engine,mode=max,ignore-error=true
      - name: Start the engine
        if: steps.select.outputs.engine == 'true'
        run: |
          docker run -d --name engine -p 127.0.0.1:8081:8080 texfolia-latex-engine:local
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors "$ENGINE_URL/health"
      - name: Smoke test the engine
        if: steps.select.outputs.engine == 'true'
        run: |
          bun run apps/compiler/test/path-policy.integration.ts
          bun run apps/compiler/test/preview.integration.ts
          bun run apps/compiler/scripts/verify-biber.ts
      - name: Exercise builds with the real compiler
        if: steps.select.outputs.compile-engine == 'true'
        run: bun run --cwd apps/app test:compile-engine
      - name: Exercise uploads, compile retries, and the PDF in a browser
        if: steps.select.outputs.workspace-upload == 'true'
        run: bun run --cwd apps/app test:workspace-upload
      - name: Print engine logs
        if: failure() && steps.select.outputs.engine == 'true'
        run: docker logs engine
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select affected checks
        id: select
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_FULL_RUN: ${{ github.event_name == 'push' }}
        run: node scripts/ci-select.mjs
      - uses: ./.github/actions/setup-ci
        with:
          playwright: ${{ steps.select.outputs.production-assets }}
      - name: Verify repository scripts
        run: node --test scripts/ci-select.test.mjs scripts/markdown-headings.test.mjs
      - uses: actions/setup-go@v6
        if: steps.select.outputs.compiler == 'true'
        with:
          go-version-file: apps/compiler/engine/go.mod
          cache: true
          cache-dependency-path: apps/compiler/engine/go.sum
      - name: Record Go version for Turbo task hashes
        if: steps.select.outputs.compiler == 'true'
        run: echo "CI_GO_VERSION=$(go env GOVERSION)" >> "$GITHUB_ENV"
      - name: Build app for production
        if: steps.select.outputs.production-assets == 'true'
        run: bunx turbo run build --filter=app
      - name: Check production CSS and worker assets
        if: steps.select.outputs.production-assets == 'true'
        run: bun run --cwd apps/app test:production-assets
      - name: Install PDF preview renderer
        if: steps.select.outputs.compiler == 'true'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Typecheck affected packages and dependents
        if: steps.select.outputs.package-checks == 'true'
        env:
          TURBO_FILTER: ${{ steps.select.outputs.turbo-filter }}
        run: bunx turbo run typecheck $TURBO_FILTER
      - name: Test affected packages and dependents
        if: steps.select.outputs.package-checks == 'true'
        env:
          TURBO_FILTER: ${{ steps.select.outputs.turbo-filter }}
        run: bunx turbo run test $TURBO_FILTER
      - name: Lint repository and affected packages
        env:
          TURBO_FILTER: ${{ steps.select.outputs.turbo-filter }}
        run: |
          bun run check:repo
          bunx oxlint
          bunx turbo run lint $TURBO_FILTER
      - name: Check repository and affected package formatting
        env:
          TURBO_FILTER: ${{ steps.select.outputs.turbo-filter }}
        run: |
          bunx oxfmt --check
          bunx turbo run format:check $TURBO_FILTER
