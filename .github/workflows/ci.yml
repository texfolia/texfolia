name: CI

on: pull_request

permissions:
  contents: read

jobs:
  postgres:
    name: App database with plain Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: texfolia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d texfolia_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://user:password@127.0.0.1:5432/texfolia_test
      INTEGRATION_DATABASE_URL: postgres://user:password@127.0.0.1:5432/texfolia_test
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Apply database schema
        run: bun run db:push
      - name: Exercise app database operations
        run: bun run apps/web/test/postgres.ts
      - name: Install Chromium
        run: bun run --cwd apps/web playwright install --with-deps chromium
      - name: Exercise real-time collaboration locally
        run: bun run --cwd apps/web test:collaboration
      - name: Exercise project source storage with local R2
        run: bun run apps/web/test/source-storage.ts
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/compiler/engine/go.mod
          cache: false
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Lint
        run: bun run lint
      - name: Check formatting
        run: bun run format:check
