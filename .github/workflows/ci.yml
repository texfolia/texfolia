name: CI

on: pull_request

permissions:
  contents: read

jobs:
  postgres:
    name: App database with plain Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: texfolia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d texfolia_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://user:password@127.0.0.1:5432/texfolia_test
      INTEGRATION_DATABASE_URL: postgres://user:password@127.0.0.1:5432/texfolia_test
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Apply database schema
        run: bun run db:push
      - name: Verify active project name migration from the legacy index
        run: bun run packages/db/test/project-names-migration.ts
      - name: Exercise app database operations
        run: bun run apps/web/test/postgres.ts
      - name: Exercise authenticated compile retries with Postgres
        run: bun run --cwd apps/web test:compile-route
      - name: Install Chromium
        run: bun run --cwd apps/web playwright install --with-deps chromium
      - name: Exercise real-time collaboration locally
        run: bun run --cwd apps/web test:collaboration
      - name: Exercise metadata synchronization in two authenticated workspaces
        run: bun run --cwd apps/web test:workspace-metadata
      - name: Exercise document history in authenticated workspaces
        run: bun run --cwd apps/web test:document-history
      - name: Exercise project source storage with local R2
        run: bun run apps/web/test/source-storage.ts
      - name: Exercise templates with Postgres and local R2
        run: bun run apps/web/test/templates.ts
      - name: Exercise template previews and retries in a browser without cron
        run: bun run --cwd apps/web test:template-lifecycle
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/compiler/engine/go.mod
          cache: false
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build web for production
        run: bun run --cwd apps/web build
      - name: Install Chromium
        run: bun run --cwd apps/web playwright install --with-deps chromium
      - name: Check production CSS and worker assets
        run: bun run --cwd apps/web test:production-assets
      - name: Install PDF preview renderer
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Lint
        run: bun run lint
      - name: Check formatting
        run: bun run format:check
