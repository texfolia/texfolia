name: CI

on: pull_request

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Check formatting
        run: bun fmt --check apps packages package.json turbo.json tsconfig.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/compiler/engine/go.mod
          cache: false
      - name: Check Go formatting
        run: test -z "$(gofmt -l apps/compiler/engine)"
      - name: Test engine
        working-directory: apps/compiler/engine
        run: go test -race ./...
      - name: Vet engine
        working-directory: apps/compiler/engine
        run: go vet ./...
